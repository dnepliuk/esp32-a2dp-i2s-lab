[env:a2dp-arduino-minimal]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<main.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DESP_A2D_AUDIO_STATE_SUSPEND=ESP_A2D_AUDIO_STATE_REMOTE_SUSPEND
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.5

